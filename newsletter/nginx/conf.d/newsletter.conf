# Nginx 反向代理配置 · TaskOn Newsletter Engine
# 自动 Let's Encrypt TLS（jonasal/nginx-certbot 镜像内置 certbot）

# --- Listmonk Admin ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name newsletter.taskon.xyz;

    ssl_certificate     /etc/letsencrypt/live/newsletter.taskon.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newsletter.taskon.xyz/privkey.pem;

    # 安全 headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Listmonk admin 后台限 IP（W1 配 Donald + 兼职女生 IP）
    # 部署时取消注释 + 填真实 IP
    # allow 1.2.3.4;     # Donald
    # allow 5.6.7.8;     # 兼职女生
    # deny all;

    client_max_body_size 50M;

    location / {
        proxy_pass         http://listmonk:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # Open pixel / Click 重定向 / 退订页 不限 IP（订阅者要访问）
    location ~ ^/(campaign|subscription|link|preferences|webhook) {
        proxy_pass         http://listmonk:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# --- Webhook Server (接 Listmonk + SES SNS) ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name newsletter-wh.taskon.xyz;

    ssl_certificate     /etc/letsencrypt/live/newsletter-wh.taskon.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newsletter-wh.taskon.xyz/privkey.pem;

    # 仅接收 Listmonk 内部 + SES SNS / 不限 IP（SES IP 池不固定）
    # 用 WEBHOOK_SHARED_SECRET 在 Flask 内部校验

    location / {
        proxy_pass         http://webhook_server:5050;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}

# --- HTTP → HTTPS 强制重定向 ---
server {
    listen 80;
    listen [::]:80;
    server_name newsletter.taskon.xyz newsletter-wh.taskon.xyz;
    return 301 https://$host$request_uri;
}
