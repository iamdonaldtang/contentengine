<?xml version="1.0" encoding="UTF-8"?>
<!-- TaskOn visual template: data_landscape (1600x900) data-contrast card for x_hero.
     Placeholders: {{TITLE}} {{STAT1}} {{STAT1_LABEL}} {{STAT2}} {{STAT2_LABEL}} {{TAG}} {{BRAND}} -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="10" fill="url(#accent)"/>
  <text x="110" y="150" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="30" font-weight="700" fill="#00e5ff" letter-spacing="2">{{TAG}}</text>
  <text x="110" y="250" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="72" font-weight="800" fill="#ffffff">{{TITLE}}</text>
  <!-- left stat -->
  <rect x="110" y="340" rx="24" width="640" height="380" fill="#0e1424" stroke="#1d2740" stroke-width="2"/>
  <text x="430" y="540" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="150" font-weight="800" fill="#00e5ff">{{STAT1}}</text>
  <text x="430" y="630" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="38" fill="#9aa6c4">{{STAT1_LABEL}}</text>
  <!-- right stat -->
  <rect x="850" y="340" rx="24" width="640" height="380" fill="#0e1424" stroke="#1d2740" stroke-width="2"/>
  <text x="1170" y="540" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="150" font-weight="800" fill="#7c5cff">{{STAT2}}</text>
  <text x="1170" y="630" text-anchor="middle" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="38" fill="#9aa6c4">{{STAT2_LABEL}}</text>
  <text x="110" y="820" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="34" font-weight="700" fill="#ffffff">{{BRAND}}</text>
</svg>
