<?xml version="1.0" encoding="UTF-8"?>
<!-- TaskOn visual template: quote_landscape (1600x900, 16:9) for x_hero / yt_thumb.
     Placeholders replaced by jobs/visual_runner.py: {{TITLE}} {{SUBTITLE}} {{TAG}} {{BRAND}}
     Style: crypto dark neon. Font family resolved at render time (Noto Sans CJK SC). -->
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#0d1330"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="10" fill="url(#accent)"/>
  <circle cx="1380" cy="180" r="220" fill="#7c5cff" opacity="0.10"/>
  <circle cx="240" cy="760" r="180" fill="#00e5ff" opacity="0.08"/>
  <!-- tag chip -->
  <rect x="110" y="120" rx="26" ry="26" width="320" height="56" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <text x="135" y="158" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="30" font-weight="700" fill="#00e5ff" letter-spacing="2">{{TAG}}</text>
  <!-- title (runner wraps into tspans) -->
  <text x="110" y="430" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="92" font-weight="800" fill="#ffffff">{{TITLE}}</text>
  <!-- subtitle -->
  <text x="112" y="690" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="40" font-weight="400" fill="#9aa6c4">{{SUBTITLE}}</text>
  <!-- brand -->
  <text x="110" y="820" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="34" font-weight="700" fill="#ffffff">{{BRAND}}</text>
  <rect x="108" y="730" width="64" height="4" fill="url(#accent)"/>
</svg>
