<?xml version="1.0" encoding="UTF-8"?>
<!-- TaskOn visual template: quote_portrait (1080x1350, 4:5) for carousel pages.
     Placeholders: {{TITLE}} {{SUBTITLE}} {{TAG}} {{PAGE}} {{BRAND}} -->
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="1" stop-color="#0d1330"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1350" fill="url(#bg)"/>
  <rect x="0" y="0" width="1080" height="10" fill="url(#accent)"/>
  <text x="90" y="150" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="28" font-weight="700" fill="#00e5ff" letter-spacing="2">{{TAG}}</text>
  <text x="980" y="150" text-anchor="end" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="28" font-weight="700" fill="#5a6a8c">{{PAGE}}</text>
  <text x="90" y="560" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="76" font-weight="800" fill="#ffffff">{{TITLE}}</text>
  <text x="92" y="980" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="38" fill="#9aa6c4">{{SUBTITLE}}</text>
  <rect x="88" y="1240" width="64" height="4" fill="url(#accent)"/>
  <text x="90" y="1300" font-family="Noto Sans CJK SC, Noto Sans, sans-serif" font-size="30" font-weight="700" fill="#ffffff">{{BRAND}}</text>
</svg>
